<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Compute Scaling — Dependency Explorer</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242838; --border: #2e3348;
    --text: #e2e4ea; --text2: #9ca0b0; --accent: #6c8cff; --accent2: #4ecdc4;
    --orange: #ff9f43; --red: #ff6b6b; --green: #51cf66; --purple: #cc5de8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; overflow:hidden; height:100vh; }

  .app { display:grid; grid-template-columns:360px 1fr; grid-template-rows:auto 1fr; height:100vh; }
  header { grid-column:1/-1; padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:17px; font-weight:700; letter-spacing:-0.3px; }
  header .subtitle { font-size:12px; color:var(--text2); }
  header a { color:var(--accent); text-decoration:none; }
  header a:hover { text-decoration:underline; }
  .scenario-bar { display:flex; gap:6px; flex-wrap:wrap; }
  .scenario-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:5px; font-size:11px; cursor:pointer; transition:all .15s; }
  .scenario-btn:hover { border-color:var(--accent); color:var(--accent); }
  .scenario-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* ─── sidebar ─── */
  .sidebar { overflow-y:auto; border-right:1px solid var(--border); background:var(--surface); }
  .section { border-bottom:1px solid var(--border); }
  .section-header { padding:12px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; user-select:none; transition:background .15s; }
  .section-header:hover { background:var(--surface2); }
  .section-header.hl { background:rgba(108,140,255,.12); }
  .section-header h3 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .section-header .arrow { font-size:10px; color:var(--text2); transition:transform .2s; }
  .section-header.open .arrow { transform:rotate(90deg); }
  .section-body { padding:0 16px 14px; display:none; }
  .section-header.open + .section-body { display:block; }

  .param { margin-bottom:12px; }
  .param label { display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-bottom:3px; }
  .param label .val { color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums; }
  .param input[type=range] { width:100%; accent-color:var(--accent); height:4px; }
  .param .bounds { display:flex; justify-content:space-between; font-size:9px; color:#555; margin-top:1px; }
  .source-link { display:inline-block; font-size:10px; color:var(--orange); text-decoration:none; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .source-link:hover { text-decoration:underline; }

  /* ─── main panel ─── */
  .main { display:flex; flex-direction:column; overflow:hidden; }

  /* ─── tabs ─── */
  .tab-bar { display:flex; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .tab-btn { padding:10px 20px; font-size:12px; font-weight:600; cursor:pointer; border:none; background:transparent; color:var(--text2); border-bottom:2px solid transparent; transition:all .15s; }
  .tab-btn:hover { color:var(--text); background:var(--surface2); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

  .tab-content { flex:1; overflow:hidden; display:none; }
  .tab-content.active { display:flex; flex-direction:column; }

  /* ─── diagram tab ─── */
  .diagram-wrap { flex:1; overflow:auto; padding:16px; position:relative; background:#13151f; }
  .diagram-wrap svg { width:100%; height:auto; min-width:900px; }

  /* SVG highlighting */
  .diagram-wrap svg .node { cursor:pointer; transition:opacity .2s; }
  .diagram-wrap svg .edge { transition:opacity .2s; }
  .diagram-wrap svg.has-selection .node { opacity:0.2; }
  .diagram-wrap svg.has-selection .edge { opacity:0.08; }
  .diagram-wrap svg.has-selection .node.hl { opacity:1; }
  .diagram-wrap svg.has-selection .edge.hl { opacity:1; }
  .diagram-wrap svg .node.hl polygon,
  .diagram-wrap svg .node.hl ellipse { stroke:#6c8cff !important; stroke-width:3px !important; }
  .diagram-wrap svg .node.hl-glow polygon,
  .diagram-wrap svg .node.hl-glow ellipse { filter:drop-shadow(0 0 8px rgba(108,140,255,.6)); }
  .diagram-wrap svg .edge.hl path { stroke:#6c8cff !important; stroke-width:2px !important; }
  .diagram-wrap svg .edge.hl polygon { stroke:#6c8cff !important; fill:#6c8cff !important; }

  .diagram-wrap svg .cluster polygon { cursor:pointer; transition:opacity .2s; }
  .diagram-wrap svg.has-selection .cluster { opacity:0.25; }
  .diagram-wrap svg.has-selection .cluster.hl { opacity:1; }

  /* ─── analysis tab ─── */
  .analysis { flex:1; overflow-y:auto; padding:20px; }
  .results { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:18px; }
  .results h3 { font-size:14px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .results h3::before { content:''; width:4px; height:16px; border-radius:2px; }
  .result-row { display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; gap:12px; }
  .result-row:last-child { border-bottom:none; }
  .result-row .label { color:var(--text2); flex:1; }
  .result-row .value { font-weight:700; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .value.green { color:var(--green); } .value.red { color:var(--red); }
  .value.orange { color:var(--orange); } .value.accent { color:var(--accent); }

  .flow-row { display:flex; gap:0; margin-bottom:18px; }
  .flow-block { flex:1; padding:10px 12px; font-size:11px; position:relative; cursor:pointer; transition:filter .15s; }
  .flow-block:hover { filter:brightness(1.3); }
  .flow-block::after { content:'→'; position:absolute; right:-7px; top:50%; transform:translateY(-50%); font-size:15px; color:var(--text2); z-index:1; }
  .flow-block:last-child::after { display:none; }
  .flow-block .fb-label { font-size:9px; color:var(--text2); text-transform:uppercase; letter-spacing:.4px; }
  .flow-block .fb-value { font-size:15px; font-weight:700; margin-top:1px; }
  .flow-block.euv { background:#1a2744; border-left:3px solid var(--accent); }
  .flow-block.fab { background:#1a3324; border-left:3px solid var(--green); }
  .flow-block.pwr { background:#2a2010; border-left:3px solid var(--orange); }
  .flow-block.dc  { background:#1a2a2a; border-left:3px solid var(--accent2); }
  .flow-block.lab { background:#2a1a24; border-left:3px solid var(--red); }

  /* ─── timeline projection ─── */
  .timeline { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:18px; }
  .timeline h3 { font-size:14px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .timeline h3::before { content:''; width:4px; height:16px; border-radius:2px; background:var(--accent2); }
  .timeline .tl-sub { font-size:11px; color:var(--text2); margin-bottom:14px; }

  .tl-grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; margin-bottom:16px; }
  .tl-col { text-align:center; }
  .tl-year { font-size:11px; font-weight:600; color:var(--text2); margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border); }
  .tl-year.now { color:var(--accent); border-bottom-color:var(--accent); }

  .tl-bar-wrap { position:relative; height:120px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
  .tl-bar { width:36px; border-radius:4px 4px 0 0; transition:height .3s ease; position:relative; min-height:4px; }
  .tl-bar.chip  { background:linear-gradient(180deg, #6c8cff 0%, #4a6cd4 100%); }
  .tl-bar.power { background:linear-gradient(180deg, #ff9f43 0%, #d4802e 100%); position:absolute; bottom:0; width:20px; left:calc(50% + 12px); border-radius:3px 3px 0 0; opacity:.55; }
  .tl-bar-val { font-size:12px; font-weight:700; color:var(--accent2); margin-top:4px; }

  .tl-demand-line { position:absolute; width:100%; border-top:2px dashed var(--red); left:0; }
  .tl-demand-tag { position:absolute; right:-2px; top:-14px; font-size:8px; color:var(--red); font-weight:600; white-space:nowrap; }

  .tl-metrics { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .tl-metric { background:var(--surface2); border-radius:8px; padding:10px 12px; text-align:center; }
  .tl-metric .tm-label { font-size:10px; color:var(--text2); margin-bottom:2px; }
  .tl-metric .tm-value { font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; }
  .tl-metric .tm-detail { font-size:10px; color:var(--text2); margin-top:2px; }

  .tl-bottleneck { display:flex; align-items:center; gap:8px; margin-top:12px; padding:10px 14px; border-radius:8px; font-size:12px; }
  .tl-bottleneck.ok { background:rgba(81,207,102,.08); border:1px solid rgba(81,207,102,.2); color:var(--green); }
  .tl-bottleneck.warn { background:rgba(255,159,67,.08); border:1px solid rgba(255,159,67,.2); color:var(--orange); }
  .tl-bottleneck.crit { background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.2); color:var(--red); }

  /* ─── cards tab ─── */
  .cards-wrap { flex:1; overflow-y:auto; padding:20px; }
  .node-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
  .node-card { background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:14px; cursor:pointer; transition:all .2s; }
  .node-card:hover { border-color:var(--accent); box-shadow:0 0 16px rgba(108,140,255,.12); }
  .node-card.hl { border-color:var(--accent); background:rgba(108,140,255,.06); box-shadow:0 0 20px rgba(108,140,255,.18); }
  .node-card h4 { font-size:13px; font-weight:600; margin-bottom:5px; display:flex; align-items:center; gap:7px; }
  .node-card .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .node-card .stats { font-size:11px; color:var(--text2); }
  .node-card .stats .num { color:var(--accent2); font-weight:600; }
  .node-card .deps { margin-top:6px; font-size:10px; color:var(--text2); }
  .node-card .deps span { color:var(--purple); }
  .node-card .source { display:block; margin-top:6px; font-size:10px; color:var(--orange); text-decoration:none; }
  .node-card .source:hover { text-decoration:underline; }

  /* legend */
  .legend { display:flex; flex-wrap:wrap; gap:10px; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--surface); font-size:11px; flex-shrink:0; }
  .legend .item { display:flex; align-items:center; gap:4px; cursor:pointer; padding:2px 6px; border-radius:4px; transition:background .15s; }
  .legend .item:hover { background:var(--surface2); }
  .legend .swatch { width:10px; height:10px; border-radius:2px; }
  .legend .item.active { background:rgba(108,140,255,.15); }

  .clear-btn { position:fixed; bottom:16px; right:16px; background:var(--surface2); border:1px solid var(--border); color:var(--text2); padding:6px 14px; border-radius:6px; font-size:11px; cursor:pointer; z-index:50; display:none; transition:all .15s; }
  .clear-btn:hover { border-color:var(--accent); color:var(--accent); }
  .clear-btn.show { display:block; }

  @media (max-width:900px) {
    .app { grid-template-columns:1fr; grid-template-rows:auto auto 1fr; }
    .sidebar { max-height:35vh; border-right:none; border-bottom:1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>AI Compute Scaling — Dependency Explorer</h1>
      <div class="subtitle">Based on the <a href="https://www.dwarkesh.com/p/dylan-patel" target="_blank">Dwarkesh × Dylan Patel interview</a>. Click any node, card, or slider section to highlight its place in the supply chain.</div>
    </div>
    <div class="scenario-bar" id="scenarioBar"></div>
  </header>
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="diagram">Diagram</button>
      <button class="tab-btn" data-tab="analysis">Analysis</button>
      <button class="tab-btn" data-tab="cards">Cards</button>
    </div>

    <div class="tab-content active" id="tab-diagram">
      <div class="legend" id="legend"></div>
      <div class="diagram-wrap" id="diagramWrap"><!-- SVG injected here --></div>
    </div>
    <div class="tab-content" id="tab-analysis">
      <div class="analysis" id="analysisPanel"></div>
    </div>
    <div class="tab-content" id="tab-cards">
      <div class="cards-wrap" id="cardsPanel"></div>
    </div>
  </div>
</div>
<button class="clear-btn" id="clearBtn" title="Clear selection">✕ Clear selection</button>

<script>
// ═══════════════════════════════════════════════════════════
//  DATA MODEL
// ═══════════════════════════════════════════════════════════
const BASE = "https://www.dwarkesh.com/p/dylan-patel";
const SRC = (frag) => `${BASE}#details`;

// ---------- sections ----------
const sections = {
  euv:   { label:"EUV Lithography",      color:"#6c8cff", svgNodes:["cymer","zeiss","reticle_stage","wafer_stage","euv_assembly","euv_tools","euv_per_gw"], svgClusters:["cluster_asml_supply","cluster_euv"] },
  fab:   { label:"Wafer Fabrication",     color:"#51cf66", svgNodes:["logic_3nm","logic_5nm","tsmc_alloc"], svgClusters:["cluster_fab"] },
  mem:   { label:"Memory / HBM",          color:"#cc5de8", svgNodes:["dram_wafers","hbm","mem_cost"], svgClusters:["cluster_memory"] },
  gpu:   { label:"GPU & Architecture",    color:"#e8b84d", svgNodes:["nvidia_gpu","nvidia_contracts","comm_bandwidth"], svgClusters:["cluster_chips"] },
  power: { label:"Power & Construction",  color:"#ff9f43", svgNodes:["power_deploy","turbines","dc_build"], svgClusters:["cluster_power"] },
  dc:    { label:"Data Centers",          color:"#4ecdc4", svgNodes:["dc","dc_build"], svgClusters:["cluster_dc"] },
  labs:  { label:"AI Lab Demand",         color:"#ff6b6b", svgNodes:["anthropic","openai","h100_econ"], svgClusters:[] },
  china: { label:"China Trajectory",      color:"#888",    svgNodes:["china_duv","china_euv"], svgClusters:["cluster_china"] },
};

// ---------- parameters ----------
const params = {
  euvToolsPerYear2025:{ val:80, min:50,max:150,step:5, unit:"tools/yr", label:"ASML EUV tools/yr (2025)", section:"euv", note:"ASML producing ~70 EUV tools/year, 2025: ~80 tools" },
  euvToolsPerYear2030:{ val:100,min:60,max:200,step:5, unit:"tools/yr", label:"ASML EUV tools/yr (2030 max)", section:"euv", note:"2030 projection: ~100 tools maximum" },
  euvInstalledBase2030:{ val:700,min:400,max:1200,step:25, unit:"tools", label:"Installed EUV base by 2030", section:"euv", note:"Total installed base by 2030: ~700 EUV tools" },
  euvToolsPerGW:{ val:3.5,min:1,max:8,step:0.1, unit:"tools/GW", label:"EUV tools required per GW", section:"euv", note:"3.5 tools per GW (75 wafers/hr, 90% uptime)" },
  euvToolCost:{ val:400,min:200,max:800,step:25, unit:"M$", label:"Cost per EUV tool", section:"euv", note:"Three EUV tools cost $1.2B → ~$400M each" },
  logicWafers3nmPerGW:{ val:55000,min:20000,max:100000,step:5000, unit:"wafers/GW", label:"3 nm logic wafers per GW", section:"fab", note:"55,000 wafers of 3nm logic per GW" },
  logicWafers5nmPerGW:{ val:6000,min:2000,max:20000,step:1000, unit:"wafers/GW", label:"5 nm logic wafers per GW", section:"fab", note:"6,000 wafers of 5nm logic per GW" },
  dramWafersPerGW:{ val:170000,min:50000,max:400000,step:10000, unit:"wafers/GW", label:"DRAM wafers per GW", section:"mem", note:"170,000 wafers of DRAM per GW" },
  hbmWaferPenalty:{ val:3.5,min:2,max:6,step:0.5, unit:"×", label:"HBM stacking wafer penalty", section:"mem", note:"DRAM has 3–4× more bits/wafer than HBM" },
  usPowerDeployed2026:{ val:20,min:5,max:60,step:1, unit:"GW", label:"US power deployed (2026)", section:"power", note:"~20 gigawatts deployed in US this year" },
  dcBuildMonths:{ val:10,min:4,max:24,step:1, unit:"months", label:"Data center build time", section:"power", note:"DC construction: 8 months to <1 year" },
  fabBuildYears:{ val:2.5,min:1.5,max:5,step:0.5, unit:"years", label:"Fab construction time", section:"power", note:"Fab construction: 2–3 years" },
  dcCapexPerGW:{ val:50,min:20,max:100,step:5, unit:"B$/GW", label:"Data center CapEx per GW", section:"dc", note:"One gigawatt DC CapEx: ~$50 billion" },
  bigTechCapex2026:{ val:600,min:200,max:1200,step:50, unit:"B$", label:"Big Tech combined CapEx (2026)", section:"dc", note:"Big Tech 2026 CapEx: ~$600 billion" },
  anthropicCurrentGW:{ val:2.25,min:1,max:10,step:0.25, unit:"GW", label:"Anthropic current capacity", section:"labs", note:"Current capacity: 2–2.5 gigawatts" },
  anthropicNeededGW:{ val:5.5,min:3,max:15,step:0.5, unit:"GW", label:"Anthropic needed by EOY", section:"labs", note:"Needed by year-end: 5–6 gigawatts" },
  openaiTargetGW:{ val:52,min:20,max:120,step:2, unit:"GW", label:"OpenAI 2030 target", section:"labs", note:"Sam Altman's goal: 52 GW/yr by 2030" },
  h100MfgCostPerHr:{ val:1.40,min:0.50,max:3.00,step:0.05, unit:"$/hr", label:"H100 mfg cost (5-yr depr.)", section:"gpu", note:"Mfg cost: ~$1.40/hr across 5-year depreciation" },
  h100SpotPricePerHr:{ val:2.40,min:1.00,max:5.00,step:0.10, unit:"$/hr", label:"H100 spot price", section:"gpu", note:"Spot pricing: up to $2.40/hr (2–3 yr contracts)" },
  hopperToBlackwellSpeedup:{ val:20,min:5,max:50,step:1, unit:"×", label:"Hopper→Blackwell inference speedup", section:"gpu", note:"Hopper to Blackwell: ~20× speedup" },
  chinaDuvTools2030:{ val:100,min:30,max:200,step:10, unit:"tools/yr", label:"China domestic DUV (2030)", section:"china", note:"DUV: likely ~100 tools/yr by 2030" },
  chinaEuvHvmYears:{ val:6,min:3,max:15,step:1, unit:"years", label:"China EUV HVM timeline", section:"china", note:"Production hell: 5–7 yr minimum (ASML precedent)" },
  // Power growth params
  usPowerGrowthPctPerYr:{ val:15,min:5,max:40,step:1, unit:"%/yr", label:"US DC power growth rate", section:"power", note:"US transitioning from 0% to rapid DC power growth" },
  // EUV ramp shape
  euvInstalledBase2025:{ val:450,min:300,max:600,step:25, unit:"tools", label:"Installed EUV base (2025)", section:"euv", note:"Cumulative EUV tools installed by end of 2025" },
};

// ---------- graph edges (for connected-highlight) ----------
const edges = {
  cymer:["euv_assembly"], zeiss:["euv_assembly"], reticle_stage:["euv_assembly"], wafer_stage:["euv_assembly"],
  euv_assembly:["euv_tools"], euv_tools:["euv_per_gw","china_euv"],
  euv_per_gw:["logic_3nm","logic_5nm","dram_wafers"],
  tsmc_alloc:["logic_3nm","logic_5nm"],
  logic_3nm:["nvidia_gpu"], logic_5nm:["nvidia_gpu"],
  dram_wafers:["hbm"], hbm:["nvidia_gpu","mem_cost"],
  nvidia_contracts:["nvidia_gpu","hbm"], comm_bandwidth:["nvidia_gpu"],
  nvidia_gpu:["dc"], power_deploy:["dc"], turbines:["power_deploy"], dc_build:["dc"],
  dc:["anthropic","openai"], anthropic:["h100_econ"], openai:["h100_econ"],
  h100_econ:["nvidia_gpu"], china_duv:["china_euv"],
};

// Build reverse edges + edge set
const revEdges = {};
const edgeSet = new Set();
for (const [src, dsts] of Object.entries(edges)) {
  for (const dst of dsts) {
    (revEdges[dst] = revEdges[dst] || []).push(src);
    edgeSet.add(`${src}->${dst}`);
    edgeSet.add(`${dst}->${src}`); // for undirected lookup
  }
}

function getConnected(nodeId) {
  const nodes = new Set([nodeId]);
  (edges[nodeId]||[]).forEach(n => nodes.add(n));
  (revEdges[nodeId]||[]).forEach(n => nodes.add(n));
  return nodes;
}

// ---------- node → card mapping ----------
const cardDefs = [
  { id:"cymer",     section:"euv",   title:"Cymer EUV Source",     color:"#ff9f43", svgNodes:["cymer"] },
  { id:"zeiss",     section:"euv",   title:"Carl Zeiss Optics",    color:"#ff9f43", svgNodes:["zeiss"] },
  { id:"euv_assembly", section:"euv", title:"EUV Assembly",        color:"#6c8cff", svgNodes:["euv_assembly"] },
  { id:"euv_tools", section:"euv",   title:"ASML EUV Tools",       color:"#6c8cff", svgNodes:["euv_tools"] },
  { id:"euv_per_gw",section:"euv",   title:"EUV → GW Conversion",  color:"#4ecdc4", svgNodes:["euv_per_gw"] },
  { id:"logic_3nm", section:"fab",   title:"3 nm Logic Wafers",    color:"#51cf66", svgNodes:["logic_3nm"] },
  { id:"logic_5nm", section:"fab",   title:"5 nm Logic Wafers",    color:"#51cf66", svgNodes:["logic_5nm"] },
  { id:"tsmc_alloc",section:"fab",   title:"TSMC Allocation",      color:"#51cf66", svgNodes:["tsmc_alloc"] },
  { id:"dram_wafers",section:"mem",  title:"DRAM Wafers",          color:"#cc5de8", svgNodes:["dram_wafers"] },
  { id:"hbm",       section:"mem",   title:"HBM Stacking",         color:"#cc5de8", svgNodes:["hbm"] },
  { id:"mem_cost",  section:"mem",   title:"Memory Cost Surge",    color:"#cc5de8", svgNodes:["mem_cost"] },
  { id:"nvidia_gpu",section:"gpu",   title:"Nvidia GPUs",          color:"#e8b84d", svgNodes:["nvidia_gpu"] },
  { id:"nvidia_contracts",section:"gpu", title:"Nvidia Contracts",  color:"#e8b84d", svgNodes:["nvidia_contracts"] },

// ═══════════════════════════════════════════════════════════
//  SVG HIGHLIGHTING
// ═══════════════════════════════════════════════════════════
function applyHighlight() {
  const svg = document.querySelector('#diagramWrap svg');
  if (!svg) return;

  const hasSelection = selectedNodes.size > 0;
  svg.classList.toggle('has-selection', hasSelection);
  document.getElementById('clearBtn').classList.toggle('show', hasSelection);

  // --- Nodes ---
  svg.querySelectorAll('.node').forEach(g => {
    const title = g.querySelector('title');
    if (!title) return;
    const name = title.textContent.trim();
    const isHl = selectedNodes.has(name);
    g.classList.toggle('hl', isHl);
    g.classList.toggle('hl-glow', isHl);
  });

  // --- Edges ---
  svg.querySelectorAll('.edge').forEach(g => {
    const title = g.querySelector('title');
    if (!title) return;
    const raw = title.textContent.trim();  // "src->dst" or "src&#45;&gt;dst"
    const parts = raw.split(/->|&#45;&gt;|→/);
    if (parts.length === 2) {
      const [a,b] = parts.map(s=>s.trim());
      const isHl = selectedNodes.has(a) && selectedNodes.has(b);
      g.classList.toggle('hl', isHl);
    }
  });

  // --- Clusters ---
  const hlClusters = new Set();
  if (selectedSection) {
    (sections[selectedSection].svgClusters || []).forEach(c => hlClusters.add(c));
  } else {
    // find which sections the selected nodes belong to
    for (const [sk,sv] of Object.entries(sections)) {
      if (sv.svgNodes.some(n => selectedNodes.has(n))) {
        (sv.svgClusters||[]).forEach(c => hlClusters.add(c));
      }
    }
  }
  svg.querySelectorAll('.cluster').forEach(g => {
    const title = g.querySelector('title');
    if (!title) return;
    g.classList.toggle('hl', hlClusters.has(title.textContent.trim()));
  });

  // --- Sidebar section headers ---
  document.querySelectorAll('.section-header').forEach(el => {
    const sec = el.dataset.section;
    if (!sec) return;
    const secNodes = sections[sec]?.svgNodes || [];
    el.classList.toggle('hl', secNodes.some(n => selectedNodes.has(n)));
  });

  // --- Cards ---
  document.querySelectorAll('.node-card').forEach(el => {
    el.classList.toggle('hl', selectedNodes.has(el.dataset.nodeId));
  });

  // --- Legend ---
  document.querySelectorAll('.legend .item').forEach(el => {
    el.classList.toggle('active', el.dataset.section === selectedSection);
  });
}

// ═══════════════════════════════════════════════════════════
//  COMPUTE
// ═══════════════════════════════════════════════════════════
function compute() {
  const p = {}; for (const [k,v] of Object.entries(params)) p[k] = v.val;
  const maxGW2030 = p.euvInstalledBase2030 / p.euvToolsPerGW;
  const openaiSharePct = (p.openaiTargetGW / maxGW2030)*100;
  const euvCostPerGW = (p.euvToolsPerGW * p.euvToolCost)/1000;
  const euvPctOfDcCapex = (euvCostPerGW / p.dcCapexPerGW)*100;
  const anthropicGap = p.anthropicNeededGW - p.anthropicCurrentGW;
  const anthropicEuvTools = anthropicGap * p.euvToolsPerGW;
  const h100GrossMargin = ((p.h100SpotPricePerHr - p.h100MfgCostPerHr)/p.h100SpotPricePerHr)*100;
  const totalGWfromCapex = p.bigTechCapex2026 / p.dcCapexPerGW;
  const euvToolsNeededForCapex = totalGWfromCapex * p.euvToolsPerGW;
  const euvYearsToFillCapex = euvToolsNeededForCapex / p.euvToolsPerYear2025;
  const hbmEffectiveWafers = p.dramWafersPerGW * p.hbmWaferPenalty;
  const chinaEuvReady = 2026 + p.chinaEuvHvmYears;
  return { maxGW2030, openaiSharePct, euvCostPerGW, euvPctOfDcCapex, anthropicGap, anthropicEuvTools,
    h100GrossMargin, totalGWfromCapex, euvToolsNeededForCapex, euvYearsToFillCapex, hbmEffectiveWafers, chinaEuvReady };
}

// ═══════════════════════════════════════════════════════════
//  TIMELINE PROJECTION — year-by-year capacity model
// ═══════════════════════════════════════════════════════════
function computeTimeline() {
  const p = {}; for (const [k,v] of Object.entries(params)) p[k] = v.val;
  const years = [2025, 2026, 2027, 2028, 2029, 2030];

  // ── EUV tool production ramp (linear interpolation 2025→2030) ──
  const euvRateSlope = (p.euvToolsPerYear2030 - p.euvToolsPerYear2025) / 5;
  function euvRate(yr) { return p.euvToolsPerYear2025 + euvRateSlope * (yr - 2025); }

  // ── Cumulative EUV installed base ──
  // Start: euvInstalledBase2025. Each subsequent year adds that year's production.
  const euvBase = [p.euvInstalledBase2025];
  for (let i = 1; i < years.length; i++) {
    euvBase.push(euvBase[i-1] + euvRate(years[i]));
  }

  // ── Chip-limited GW: installed tools ÷ tools-per-GW ──
  const chipGW = euvBase.map(b => b / p.euvToolsPerGW);

  // ── Power-limited GW: compound growth from 2026 baseline ──
  const powerGrowth = p.usPowerGrowthPctPerYr / 100;
  const powerGW = years.map(yr => {
    if (yr <= 2026) return p.usPowerDeployed2026;
    return p.usPowerDeployed2026 * Math.pow(1 + powerGrowth, yr - 2026);
  });

  // ── Effective GW = min(chip, power) ──
  const effectiveGW = years.map((_, i) => Math.min(chipGW[i], powerGW[i]));

  // ── Bottleneck identification ──
  const bottleneck = years.map((_, i) => chipGW[i] <= powerGW[i] ? 'chip' : 'power');

  // ── Demand markers ──
  const anthropicDemand = years.map(yr => {
    if (yr <= 2025) return p.anthropicCurrentGW;
    // linear ramp to EOY 2026 need, then 40% yr/yr growth assumption after
    if (yr === 2026) return p.anthropicNeededGW;
    return p.anthropicNeededGW * Math.pow(1.4, yr - 2026);
  });
  const openaiDemand = years.map(yr => {
    // Linear ramp from ~5 GW in 2025 to target in 2030
    const start = 5;
    if (yr <= 2025) return start;
    const t = (yr - 2025) / 5;
    return start + (p.openaiTargetGW - start) * t;
  });

  // ── Cumulative CapEx (billions) ──
  const cumCapex = effectiveGW.map(gw => gw * p.dcCapexPerGW);

  // ── EUV tools cost as % of total per year ──
  const euvCapexPct = years.map((_, i) => {
    const euvCost = euvBase[i] * (p.euvToolCost / 1000); // B$
    return cumCapex[i] > 0 ? (euvCost / cumCapex[i]) * 100 : 0;
  });

  return { years, euvBase, euvRate: years.map(euvRate), chipGW, powerGW, effectiveGW,
    bottleneck, anthropicDemand, openaiDemand, cumCapex, euvCapexPct };
}

function fmt(v, unit) {
  if (unit==='M$') return `$${v}M`;
  if (unit==='B$') return `$${v}B`;
  if (unit==='B$/GW') return `$${v}B/GW`;
  if (unit==='$/hr') return `$${v.toFixed(2)}/hr`;
  if (unit==='×') return `${v}×`;
  if (v>=10000) return `${(v/1000).toFixed(0)}k ${unit}`;
  if (v>=1000) return `${(v/1000).toFixed(1)}k ${unit}`;
  return `${v} ${unit}`;
}

function renderSidebar() {
  let html = '';
  for (const [sk,sec] of Object.entries(sections)) {
    const sp = Object.entries(params).filter(([,v])=>v.section===sk);
    if (sp.length===0) continue;
    html += `<div class="section"><div class="section-header open" data-section="${sk}" onclick="toggleSection(this,'${sk}')"><h3><span style="color:${sec.color}">●</span> ${sec.label}</h3><span class="arrow">▶</span></div><div class="section-body">`;
    for (const [key,p] of sp) {
      html += `<div class="param"><label><span>${p.label}</span><span class="val" id="lbl_${key}">${fmt(p.val,p.unit)}</span></label>
        <input type="range" id="sl_${key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.val}" oninput="onSlider('${key}',this.value)">
        <div class="bounds"><span>${fmt(p.min,p.unit)}</span><span>${fmt(p.max,p.unit)}</span></div>
        <a class="source-link" href="${SRC()}" target="_blank">📎 ${p.note}</a></div>`;
    }
    html += '</div></div>';
  }
  document.getElementById('sidebar').innerHTML = html;
}

function toggleSection(el, secKey) {
  el.classList.toggle('open');
  // also select
  if (selectedSection === secKey) { clearSelection(); }
  else { selectBySection(secKey); }
}

function onSlider(key, val) {
  params[key].val = parseFloat(val);
  document.getElementById(`lbl_${key}`).textContent = fmt(params[key].val, params[key].unit);
  renderAnalysis();
  renderCards();
  // highlight section
  selectBySection(params[key].section);
  document.querySelectorAll('.scenario-btn').forEach(b=>b.classList.remove('active'));
}

function cardDeps(id) {
  const up = (revEdges[id]||[]).map(n=>cardDefs.find(c=>c.id===n)?.title||n);
  const down = (edges[id]||[]).map(n=>cardDefs.find(c=>c.id===n)?.title||n);
  let html = '';
  if (up.length) html += `<span style="color:var(--text2)">← </span>${up.map(t=>`<span>${t}</span>`).join(', ')}`;
  if (up.length && down.length) html += ' · ';
  if (down.length) html += `<span style="color:var(--text2)">→ </span>${down.map(t=>`<span>${t}</span>`).join(', ')}`;
  return html;
}

function renderCards() {
  document.getElementById('cardsPanel').innerHTML = `<div class="node-grid">${cardDefs.map(cd => `

}

function cardClick(nodeId) {
  if (selectedNodes.has(nodeId) && selectedNodes.size <= getConnected(nodeId).size + 1) clearSelection();

  renderCards(); // re-render card highlights
}

  document.getElementById('diagramWrap').innerHTML = svgText;

  const svg = document.querySelector('#diagramWrap svg');
  if (!svg) return;
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.style.width = '100%';
  svg.style.height = 'auto';
  svg.style.minWidth = '1000px';

  // Wire click handlers on SVG nodes
  svg.querySelectorAll('.node').forEach(g => {
    const title = g.querySelector('title');
    if (!title) return;
    const name = title.textContent.trim();
    g.style.cursor = 'pointer';
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      if (selectedNodes.has(name) && selectedNodes.size <= getConnected(name).size + 1) clearSelection();
      else selectByNodeId(name);
      renderCards();
    });
  });

  // Wire click on clusters
  svg.querySelectorAll('.cluster').forEach(g => {
    const title = g.querySelector('title');
    if (!title) return;
    const clusterName = title.textContent.trim();
    // find which section owns this cluster
    for (const [sk,sec] of Object.entries(sections)) {
      if ((sec.svgClusters||[]).includes(clusterName)) {
        const poly = g.querySelector('polygon');
        if (poly) {
          poly.style.cursor = 'pointer';
          poly.addEventListener('click', (e) => {
            e.stopPropagation();
            if (selectedSection === sk) clearSelection();
            else selectBySection(sk);
            renderCards();
          });
        }
      }
    }
  });

  // Click on background clears
  svg.addEventListener('click', () => { clearSelection(); renderCards(); });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

//  SCENARIO
// ═══════════════════════════════════════════════════════════
function applyScenario(idx) {
  activeScenario = idx;
  for (const [k,v] of Object.entries(originals)) params[k].val = v;
  for (const [k,v] of Object.entries(scenarios[idx].preset)) if (params[k]) params[k].val = v;
  for (const [k,p] of Object.entries(params)) {
    const sl = document.getElementById(`sl_${k}`);
    const lbl = document.getElementById(`lbl_${k}`);
    if (sl) sl.value = p.val;
    if (lbl) lbl.textContent = fmt(p.val, p.unit);
  }
  renderAnalysis(); renderCards(); renderScenarios();
}
