<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STARSPAN — Single-File URL-State Starship Game</title>
  <style>
    :root{
      --bg:#06070b;
      --panel:#0b0f16cc;
      --panel2:#0a1220cc;
      --text:#d6f6ff;
      --muted:#86a8b5;
      --accent:#66f2ff;
      --accent2:#9cff6a;
      --warn:#ffd166;
      --bad:#ff5c7a;
      --good:#56f39a;
      --line:#1c2c3a;
      --shadow: 0 12px 40px rgba(0,0,0,.55);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--sans);
      overflow:hidden;
    }
    #bg{
      position:fixed; inset:0;
      width:100%; height:100%;
      z-index:-2;
    }
    #vignette{
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 700px at 30% 20%, rgba(102,242,255,.10), transparent 70%),
        radial-gradient(900px 600px at 80% 70%, rgba(156,255,106,.08), transparent 70%),
        radial-gradient(1200px 900px at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
      z-index:-1;
      pointer-events:none;
    }
    .wrap{
      height:100%;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:10px;
      padding:12px;
      max-width:1200px;
      margin:0 auto;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      background:linear-gradient(180deg, var(--panel), transparent);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(8px);
    }
    .brand{
      display:flex; flex-direction:column; gap:2px;
      line-height:1.05;
    }
    .brand .t{
      font-family:var(--mono);
      letter-spacing:.12em;
      font-weight:800;
      font-size:15px;
      color:var(--accent);
      text-transform:uppercase;
    }
    .brand .s{
      font-size:12px;
      color:var(--muted);
    }
    .hud{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:8px 10px;
      font-family:var(--mono);
      font-size:12px;
      color:var(--text);
    }
    .pill{
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(8,12,18,.65);
      display:flex;
      gap:8px;
      align-items:center;
      white-space:nowrap;
    }
    .k{ color:var(--muted); }
    .v{ color:var(--text); font-weight:700; }
    .v.ac{ color:var(--accent2); }
    .v.warn{ color:var(--warn); }
    .v.bad{ color:var(--bad); }
    main{
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:10px;
      min-height:0;
    }
    @media (max-width: 980px){
      body{ overflow:auto; }
      .wrap{ overflow:auto; height:auto; min-height:100%; }
      main{ grid-template-columns:1fr; }
    }
    .panel{
      background:linear-gradient(180deg, var(--panel2), rgba(6,8,12,.55));
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(8px);
      overflow:hidden;
      min-height:0;
    }
    .panel .hd{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .panel .hd .title{
      font-family:var(--mono);
      font-weight:800;
      letter-spacing:.08em;
      font-size:12px;
      color:var(--accent);
      text-transform:uppercase;
    }
    .panel .bd{
      padding:12px;
      overflow:auto;
      min-height:0;
    }
    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .btnrow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    button, .btn{
      appearance:none;
      border:1px solid var(--line);
      background:rgba(8,12,18,.65);
      color:var(--text);
      padding:8px 10px;
      border-radius:12px;
      font-family:var(--mono);
      font-size:12px;
      cursor:pointer;
      transition: transform .06s ease, border-color .12s ease, background .12s ease;
      user-select:none;
    }
    button:hover{ border-color:rgba(102,242,255,.55); }
    button:active{ transform: translateY(1px); }
    button.primary{
      border-color:rgba(156,255,106,.55);
      background:rgba(20,40,26,.55);
    }
    button.danger{
      border-color:rgba(255,92,122,.55);
      background:rgba(48,16,24,.55);
    }
    button.ghost{
      background:transparent;
    }
    button[disabled]{ opacity:.45; cursor:not-allowed; }
    .tabs{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }
    .tab{
      padding:7px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(8,12,18,.55);
      cursor:pointer;
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
    }
    .tab.on{
      color:var(--text);
      border-color:rgba(102,242,255,.55);
      box-shadow:0 0 0 1px rgba(102,242,255,.18) inset;
    }
    .small{
      font-size:12px;
      color:var(--muted);
      line-height:1.45;
    }
    .mono{ font-family:var(--mono); }
    .hr{
      height:1px;
      background:var(--line);
      margin:10px 0;
    }
    .table{
      width:100%;
      border-collapse:collapse;
      font-family:var(--mono);
      font-size:12px;
    }
    .table th, .table td{
      padding:7px 8px;
      border-bottom:1px solid rgba(28,44,58,.75);
      text-align:left;
      vertical-align:middle;
    }
    .table th{
      color:var(--muted);
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:11px;
    }
    .right{ text-align:right; }
    .tag{
      font-family:var(--mono);
      font-size:11px;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      color:var(--muted);
      background:rgba(8,12,18,.45);
      display:inline-flex;
      gap:6px;
      align-items:center;
    }
    .tag.good{ color:var(--good); border-color:rgba(86,243,154,.35); }
    .tag.bad{ color:var(--bad); border-color:rgba(255,92,122,.35); }
    .tag.warn{ color:var(--warn); border-color:rgba(255,209,102,.35); }
    .notice{
      border:1px solid rgba(102,242,255,.35);
      background:rgba(102,242,255,.08);
      padding:10px 10px;
      border-radius:14px;
      font-size:12px;
      line-height:1.45;
      color:var(--text);
    }
    .notice .h{
      font-family:var(--mono);
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--accent);
      font-size:11px;
      margin-bottom:6px;
    }
    .kbd{
      font-family:var(--mono);
      font-size:11px;
      padding:2px 6px;
      border:1px solid var(--line);
      border-bottom-width:2px;
      border-radius:8px;
      background:rgba(8,12,18,.65);
      color:var(--text);
    }
    footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(8,12,18,.55);
      box-shadow:var(--shadow);
      backdrop-filter: blur(8px);
      font-size:12px;
      color:var(--muted);
    }
    .linklike{
      color:var(--accent);
      text-decoration:none;
      border-bottom:1px dashed rgba(102,242,255,.35);
    }
    .linklike:hover{ border-bottom-color:rgba(102,242,255,.85); }
    .mapWrap{
      position:relative;
      height:340px;
      border-radius:14px;
      border:1px solid rgba(28,44,58,.9);
      overflow:hidden;
      background:rgba(0,0,0,.25);
    }
    #map{
      width:100%;
      height:100%;
      display:block;
    }
    .mapOverlay{
      position:absolute; inset:10px 10px auto auto;
      display:flex; gap:8px; flex-wrap:wrap;
      justify-content:flex-end;
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
      max-width:min(760px, calc(100% - 24px));
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(102,242,255,.35);
      background:rgba(8,12,18,.82);
      box-shadow:var(--shadow);
      backdrop-filter: blur(8px);
      font-family:var(--mono);
      font-size:12px;
      color:var(--text);
      display:none;
      z-index:50;
    }
    .toast.show{ display:block; }
    .blink{ animation: blink 1.2s steps(2,end) infinite; }
    @keyframes blink{ 50%{ opacity:.45; } }
  </style>
</head>

<body>
<canvas id="bg"></canvas>
<div id="vignette"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="t">STARSPAN</div>
      <div class="s">Single-file starship trader & skirmish — all save/state in the URL hash.</div>
    </div>
    <div class="hud" id="hud"></div>
  </header>

  <main>
    <section class="panel">
      <div class="hd">
        <div class="title">Sector Map</div>
        <div class="tabs" id="tabsLeft"></div>
      </div>
      <div class="bd">
        <div class="mapWrap">
          <canvas id="map"></canvas>
          <div class="mapOverlay">
            <span class="tag" id="mapLocTag">—</span>
            <span class="tag" id="mapRiskTag">—</span>
          </div>
        </div>

        <div class="hr"></div>

        <div class="btnrow" id="leftActions"></div>

        <div class="hr"></div>

        <div class="small" id="leftHint"></div>
      </div>
    </section>

    <section class="panel">
      <div class="hd">
        <div class="title" id="rightTitle">—</div>
        <div class="tabs" id="tabsRight"></div>
      </div>
      <div class="bd" id="rightBody"></div>
    </section>
  </main>

  <footer>
    <div>
      <span class="mono">Tip:</span> Copy the URL to move your exact game state to another browser/device.
      <span class="mono">Keys:</span>
      <span class="kbd">1</span>Dock
      <span class="kbd">2</span>Trade
      <span class="kbd">3</span>Map
      <span class="kbd">4</span>Help
      <span class="kbd">F</span>Fire
      <span class="kbd">E</span>Evade
      <span class="kbd">B</span>Brace
      <span class="kbd">R</span>Run
    </div>
    <div class="btnrow">
      <button class="ghost" id="btnCopyUrl">Copy URL</button>
      <button class="ghost" id="btnCheckpoint" title="Pushes a new history entry (bookmark-like).">Checkpoint</button>
      <button class="ghost" id="btnAudio">Audio: —</button>
      <button class="danger" id="btnNewGame">New Game</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  /********************************************************************
   * STARSPAN — Original retro space-trader/duel game
   * - Single HTML file (SFWA)
   * - Entire game state is encoded in URL hash (no localStorage/cookies)
   * - Procedural sector & markets derived from seed (not stored)
   *
   * Design goal: evoke "classic DOS-era starship trader" vibes without
   * copying any specific game's names, UI, story, or assets.
   ********************************************************************/

  // ---------- Constants ----------
  const VERSION = 1;

  // Modes (kept numeric for compact state)
  const MODE = {
    DOCK: 0,
    TRADE: 1,
    MAP: 2,
    COMBAT: 3,
    HELP: 4,
    GAMEOVER: 5
  };

  const GOODS = [
    { n:"Ore",      b: 55,  w: 0.55 },
    { n:"Rations",  b: 40,  w: 0.35 },
    { n:"Meds",     b: 95,  w: 0.20 },
    { n:"Circuits", b: 120, w: 0.15 },
    { n:"Spice",    b: 150, w: 0.10 },
    { n:"Relics",   b: 260, w: 0.06 } // rare-ish
  ];

  const SHIP_UPGRADES = [
    { key:"lz", name:"Laser Focus",  desc:"+1 laser damage tier", cost: 900 },
    { key:"sh", name:"Shield Coil",  desc:"+1 shield tier",       cost: 850 },
    { key:"cp", name:"Cargo Pods",   desc:"+6 cargo capacity",    cost: 700 },
    { key:"fm", name:"Fuel Matrix",  desc:"+6 max fuel",          cost: 650 }
  ];

  const ENEMY_TYPES = [
    { n:"Scrap Drone",   baseH: 26, atk: 5,  reward:[120, 220],  riskMin:0.00 },
    { n:"Void Raider",   baseH: 40, atk: 7,  reward:[180, 340],  riskMin:0.25 },
    { n:"Corsair Frigate", baseH: 56, atk: 9, reward:[260, 480], riskMin:0.45 }
  ];

  const SYS_COUNT = 16;
  const MAX_NOTELEN = 84;

  // Compact state keys:
  // v version
  // sd seed
  // r rng state
  // d day
  // l location (system id)
  // cr credits
  // fu fuel
  // mf max fuel
  // hu hull
  // mh max hull
  // la laser tier
  // sh shield tier
  // cp cargo cap
  // cg cargo array [len GOODS]
  // md mode
  // jb job object or null
  // en enemy object or null
  // rp reputation
  // au audio 0/1
  // nt note (short string)

  // ---------- URL state encoding ----------
  function bytesToB64Url(bytes){
    let bin = "";
    const CHUNK = 0x8000;
    for (let i=0;i<bytes.length;i+=CHUNK){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
    }
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function b64UrlToBytes(b64url){
    const pad = "=".repeat((4 - (b64url.length % 4)) % 4);
    const b64 = b64url.replace(/-/g,"+").replace(/_/g,"/") + pad;
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function encodeState(st){
    const json = JSON.stringify(st);
    const bytes = new TextEncoder().encode(json);
    return bytesToB64Url(bytes);
  }
  function decodeState(hash){
    const raw = (hash || "").replace(/^#/, "");
    if (!raw) return null;
    try{
      const bytes = b64UrlToBytes(raw);
      const json = new TextDecoder().decode(bytes);
      const obj = JSON.parse(json);
      return obj;
    }catch(e){
      // fallback: allow raw JSON in hash (handy for debugging)
      try{
        const obj = JSON.parse(decodeURIComponent(raw));
        return obj;
      }catch(_){
        return null;
      }
    }
  }

  // ---------- Deterministic RNG (xorshift32) ----------
  function xorshift32(x){
    x >>>= 0;
    x ^= (x << 13) >>> 0;
    x ^= (x >>> 17) >>> 0;
    x ^= (x << 5) >>> 0;
    return x >>> 0;
  }
  function rand01(st){
    st.r = xorshift32(st.r);
    // 0..1 exclusive-ish
    return (st.r >>> 0) / 4294967296;
  }
  function randInt(st, n){
    return Math.floor(rand01(st) * n);
  }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  // Stateless 32-bit mix for markets/system derivations (does NOT touch st.r)
  function mix32(a){
    a = (a ^ (a >>> 16)) >>> 0;
    a = Math.imul(a, 0x7feb352d) >>> 0;
    a = (a ^ (a >>> 15)) >>> 0;
    a = Math.imul(a, 0x846ca68b) >>> 0;
    a = (a ^ (a >>> 16)) >>> 0;
    return a >>> 0;
  }
  function hashKey(seed, day, sysId, goodId, salt){
    let x = (seed ^ (day*0x9e3779b1) ^ (sysId*0x85ebca6b) ^ (goodId*0xc2b2ae35) ^ (salt|0)) >>> 0;
    return mix32(x);
  }
  function h01(seed, day, sysId, goodId, salt){
    return hashKey(seed, day, sysId, goodId, salt) / 4294967296;
  }

  // ---------- Procedural sector ----------
  function makeSystems(seed){
    const sys = [];
    for (let i=0;i<SYS_COUNT;i++){
      const a = mix32(seed ^ (i*0x9e3779b1));
      const b = mix32(seed ^ (i*0x85ebca6b) ^ 0x1234567);
      const c = mix32(seed ^ (i*0xc2b2ae35) ^ 0x89abcdef);
      const x = (a % 1000) / 1000;
      const y = (b % 1000) / 1000;
      // risk 0..1 with slightly higher toward edges
      const dx = x - 0.5, dy = y - 0.5;
      const edge = clamp(Math.sqrt(dx*dx + dy*dy) / 0.72, 0, 1);
      const noise = (c % 1000) / 1000;
      const risk = clamp(0.18*edge + 0.62*noise, 0, 1);
      sys.push({
        id:i,
        x, y,
        risk,
        name: sysName(seed, i),
        trait: sysTrait(seed, i)
      });
    }
    return sys;
  }
  function sysName(seed, i){
    const syllA = ["Ar","Bel","Cy","Dor","Ely","Fen","Gai","Hel","Iri","Jor","Kai","Lum","Mor","Niv","Ori","Pra","Qua","Ryn","Sol","Tor","Umb","Vey","Wex","Xan","Yor","Zel"];
    const syllB = ["a","e","i","o","u","ae","io","ua","ei"];
    const syllC = ["lon","ria","dor","tis","mar","vek","zen","qu","nor","phi","dell","gate","mere","hollow","spire","reach","crown","port","ward","haven","drift"];
    const k1 = mix32(seed ^ (i*0x9e3779b1) ^ 0x11111111);
    const k2 = mix32(seed ^ (i*0x85ebca6b) ^ 0x22222222);
    const k3 = mix32(seed ^ (i*0xc2b2ae35) ^ 0x33333333);
    const A = syllA[k1 % syllA.length];
    const B = syllB[k2 % syllB.length];
    const C = syllC[k3 % syllC.length];
    return A + B + C;
  }
  function sysTrait(seed, i){
    const traits = [
      { n:"Refinery Belt",   dm:[ 1.30, 1.05, 0.90, 0.95, 0.90, 0.85 ] },
      { n:"Agri Rings",      dm:[ 0.90, 1.35, 0.95, 0.90, 0.95, 0.80 ] },
      { n:"Clinic Enclave",  dm:[ 0.90, 0.95, 1.35, 1.05, 0.95, 0.85 ] },
      { n:"Chip Foundry",    dm:[ 0.95, 0.95, 1.05, 1.35, 0.95, 0.85 ] },
      { n:"Spice Bazaar",    dm:[ 0.95, 0.95, 0.95, 1.05, 1.35, 0.90 ] },
      { n:"Ruins Accord",    dm:[ 0.85, 0.90, 0.95, 0.95, 1.05, 1.35 ] },
      { n:"Neutral Port",    dm:[ 1.00, 1.00, 1.00, 1.00, 1.00, 1.00 ] },
      { n:"Frontier Outpost",dm:[ 1.10, 0.95, 0.95, 0.95, 1.05, 0.95 ] }
    ];
    const k = mix32(seed ^ (i*0x27d4eb2d) ^ 0xfeedbeef);
    return traits[k % traits.length];
  }

  function dist(a,b){
    const dx = a.x-b.x, dy = a.y-b.y;
    return Math.sqrt(dx*dx + dy*dy) * 24; // sector scale
  }

  // ---------- Economy ----------
  function market(sys, st){
    // return array of per-good: {price, avail}
    const out = [];
    for (let g=0; g<GOODS.length; g++){
      const base = GOODS[g].b;
      const traitMult = sys.trait.dm[g];
      const dayWave = 0.92 + 0.18*Math.sin((st.d + sys.id*3 + g*11) * 0.55);
      const noise = 0.78 + 0.62*h01(st.sd, st.d, sys.id, g, 0xA11CE);
      const scarcity = clamp(1.12 - 0.6*sys.risk + 0.25*h01(st.sd, st.d, sys.id, g, 0xBADC0DE), 0.55, 1.45);
      const price = Math.max(6, Math.round(base * traitMult * dayWave * noise * scarcity));
      // availability: more in low-risk ports; rare goods low
      const rare = GOODS[g].w;
      const avNoise = h01(st.sd, st.d, sys.id, g, 0xC0FFEE);
      const avail = Math.max(0, Math.floor((18*(1.10 - rare) * (1.1 - 0.7*sys.risk)) * (0.35 + 1.1*avNoise)));
      out.push({ price, avail });
    }
    return out;
  }

  // ---------- Contracts (job offers) ----------
  function makeOffer(st, sys){
    // deterministic offer per (seed, day, loc) but not stored unless accepted
    const k = mix32(st.sd ^ (st.d*0x9e3779b1) ^ (sys.id*0x85ebca6b) ^ 0x31415926);
    const g = (k >>> 0) % GOODS.length;
    // pick target != current
    const t = (mix32(k ^ 0xabcdef01) % SYS_COUNT);
    const target = (t === sys.id) ? ((t+5) % SYS_COUNT) : t;
    const qty = 2 + (mix32(k ^ 0x1234) % 6);
    const distScale = 2 + Math.floor(Math.abs(target - sys.id) / 3);
    const deadline = st.d + (3 + distScale + (mix32(k ^ 0x9999) % 4));
    const reward = Math.round((GOODS[g].b * qty) * (1.40 + 0.35*((mix32(k ^ 0x7777)%1000)/1000)) );
    return { g, q: qty, t: target, dl: deadline, rw: reward };
  }

  // ---------- Combat ----------
  function spawnEnemy(st, sys){
    const r = sys.risk;
    // choose enemy by risk threshold
    const pool = ENEMY_TYPES.filter(e => r >= e.riskMin - 0.05);
    const et = pool[Math.min(pool.length-1, randInt(st, pool.length))];
    const drift = Math.round((rand01(st)*0.40 - 0.10) * et.baseH);
    const h = Math.max(18, et.baseH + drift + Math.floor(st.d*0.15));
    const rw = et.reward[0] + randInt(st, et.reward[1]-et.reward[0]+1) + Math.floor(18*r*st.d*0.1);
    return { t: ENEMY_TYPES.indexOf(et), h, mh: h, rw };
  }

  function totalCargo(st){
    return st.cg.reduce((a,b)=>a+b,0);
  }

  // ---------- Audio (optional, deterministic-ish beeps) ----------
  let audioCtx = null;
  function beep(type){
    if (!S.au) return;
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "square";
      const f =
        type==="good" ? 660 :
        type==="bad"  ? 180 :
        type==="warn" ? 420 :
        520;
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + 0.14);
    }catch(e){}
  }

  // ---------- UI helpers ----------
  const $ = (sel) => document.querySelector(sel);
  const hudEl = $("#hud");
  const tabsLeftEl = $("#tabsLeft");
  const tabsRightEl = $("#tabsRight");
  const leftActionsEl = $("#leftActions");
  const leftHintEl = $("#leftHint");
  const rightTitleEl = $("#rightTitle");
  const rightBodyEl = $("#rightBody");
  const toastEl = $("#toast");
  const btnCopyUrl = $("#btnCopyUrl");
  const btnCheckpoint = $("#btnCheckpoint");
  const btnNewGame = $("#btnNewGame");
  const btnAudio = $("#btnAudio");
  const mapLocTag = $("#mapLocTag");
  const mapRiskTag = $("#mapRiskTag");

  function showToast(msg, ms=2200){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toastEl.classList.remove("show"), ms);
  }

  // ---------- State init / validation ----------
  function newGame(seed){
    const sd = (seed >>> 0) || (crypto.getRandomValues(new Uint32Array(1))[0] >>> 0);
    const st = {
      v: VERSION,
      sd,
      r: mix32(sd ^ 0xA5A5A5A5),
      d: 0,
      l: 0,
      cr: 1200,
      fu: 12,
      mf: 24,
      hu: 100,
      mh: 100,
      la: 1,
      sh: 0,
      cp: 20,
      cg: new Array(GOODS.length).fill(0),
      md: MODE.DOCK,
      jb: null,
      en: null,
      rp: 0,
      au: 1,
      nt: "Welcome, Captain. Your nav is live; your fortune is not."
    };
    return st;
  }

  function validateState(st){
    if (!st || typeof st !== "object") return null;
    if (st.v !== VERSION) return null;
    const reqNum = ["sd","r","d","l","cr","fu","mf","hu","mh","la","sh","cp","md","rp","au"];
    for (const k of reqNum) if (typeof st[k] !== "number" || !isFinite(st[k])) return null;
    if (!Array.isArray(st.cg) || st.cg.length !== GOODS.length) return null;
    for (let i=0;i<st.cg.length;i++){
      if (typeof st.cg[i] !== "number" || st.cg[i] < 0 || !isFinite(st.cg[i])) st.cg[i] = 0;
      st.cg[i] = Math.floor(st.cg[i]);
    }
    st.d = Math.max(0, Math.floor(st.d));
    st.l = clamp(Math.floor(st.l), 0, SYS_COUNT-1);
    st.cr = Math.max(0, Math.floor(st.cr));
    st.mf = clamp(Math.floor(st.mf), 6, 60);
    st.fu = clamp(Math.floor(st.fu), 0, st.mf);
    st.mh = clamp(Math.floor(st.mh), 30, 200);
    st.hu = clamp(Math.floor(st.hu), 0, st.mh);
    st.la = clamp(Math.floor(st.la), 1, 4);
    st.sh = clamp(Math.floor(st.sh), 0, 4);
    st.cp = clamp(Math.floor(st.cp), 6, 80);
    st.md = clamp(Math.floor(st.md), 0, MODE.GAMEOVER);
    st.rp = clamp(Math.floor(st.rp), -50, 200);
    st.au = st.au ? 1 : 0;
    st.nt = (typeof st.nt === "string") ? st.nt.slice(0, MAX_NOTELEN) : "";

    // job
    if (st.jb && typeof st.jb === "object"){
      const jb = st.jb;
      const ok = ["g","q","t","dl","rw"].every(k => typeof jb[k] === "number" && isFinite(jb[k]));
      if (!ok) st.jb = null;
      else{
        jb.g = clamp(Math.floor(jb.g), 0, GOODS.length-1);
        jb.q = clamp(Math.floor(jb.q), 1, 40);
        jb.t = clamp(Math.floor(jb.t), 0, SYS_COUNT-1);
        jb.dl = clamp(Math.floor(jb.dl), 0, 999999);
        jb.rw = clamp(Math.floor(jb.rw), 0, 999999);
      }
    } else st.jb = null;

    // enemy
    if (st.en && typeof st.en === "object"){
      const en = st.en;
      const ok = ["t","h","mh","rw"].every(k => typeof en[k] === "number" && isFinite(en[k]));
      if (!ok) st.en = null;
      else{
        en.t = clamp(Math.floor(en.t), 0, ENEMY_TYPES.length-1);
        en.mh = clamp(Math.floor(en.mh), 1, 9999);
        en.h = clamp(Math.floor(en.h), 0, en.mh);
        en.rw = clamp(Math.floor(en.rw), 0, 999999);
      }
    } else st.en = null;

    // If hull is 0, enter GAMEOVER
    if (st.hu <= 0) st.md = MODE.GAMEOVER;

    return st;
  }

  // ---------- URL sync ----------
  let syncing = false;
  function setURLFromState(push=false){
    if (syncing) return;
    syncing = true;
    const enc = encodeState(S);
    const url = "#" + enc;
    try{
      if (push) history.pushState(null, "", url);
      else history.replaceState(null, "", url);
    }finally{
      // release after paint to avoid re-entrancy
      setTimeout(()=>{ syncing = false; }, 0);
    }
  }

  function loadStateFromURL(){
    if (syncing) return;
    const decoded = decodeState(location.hash);
    const st = validateState(decoded);
    if (st) return st;
    return null;
  }

  // ---------- Game state (single source of truth) ----------
  let S = loadStateFromURL();
  if (!S){
    S = newGame();
    setURLFromState(false);
  }

  // Derived world
  function systems(){ return makeSystems(S.sd); }

  function note(msg, tone=""){
    S.nt = (msg || "").slice(0, MAX_NOTELEN);
    if (tone==="good") beep("good");
    else if (tone==="bad") beep("bad");
    else if (tone==="warn") beep("warn");
    else beep("tap");
  }

  // ---------- Core actions ----------
  function spend(amount){
    amount = Math.floor(amount);
    if (amount <= 0) return true;
    if (S.cr < amount) return false;
    S.cr -= amount;
    return true;
  }
  function earn(amount){
    S.cr += Math.max(0, Math.floor(amount));
  }

  function canTravelTo(targetId){
    const sys = systems();
    const a = sys[S.l], b = sys[targetId];
    const d = dist(a,b);
    const fuelCost = Math.max(1, Math.ceil(d/6));
    return { ok: S.fu >= fuelCost, fuelCost, dist: d };
  }

  function travelTo(targetId){
    const sys = systems();
    const a = sys[S.l], b = sys[targetId];
    const d = dist(a,b);
    const fuelCost = Math.max(1, Math.ceil(d/6));
    const timeCost = 1 + Math.floor(d/10);

    if (targetId === S.l){ note("Already in orbit here."); return; }
    if (S.fu < fuelCost){ note("Insufficient fuel for that jump.", "warn"); return; }

    S.fu -= fuelCost;
    S.d += timeCost;
    S.l = targetId;

    // chance of encounter in transit
    const risk = (a.risk + b.risk)*0.5;
    const base = 0.10 + risk*0.22;
    const repMod = clamp(0.02 * (-S.rp/20), -0.06, 0.10); // bad rep -> more trouble
    const chance = clamp(base + repMod, 0.06, 0.45);

    if (rand01(S) < chance){
      S.en = spawnEnemy(S, b);
      S.md = MODE.COMBAT;
      note(`Interdiction! ${ENEMY_TYPES[S.en.t].n} locks on.`, "warn");
    }else{
      S.md = MODE.DOCK;
      note(`Docked at ${b.name}.`, "good");
      // auto check job completion
      maybeCompleteJob();
    }
  }

  function refuel(units){
    units = Math.floor(units);
    if (units <= 0) return;
    const need = S.mf - S.fu;
    const take = Math.min(need, units);
    const cost = take * 12;
    if (!spend(cost)){ note("Not enough credits to refuel.", "warn"); return; }
    S.fu += take;
    note(`Refueled +${take}.`, "good");
  }

  function repair(points){
    points = Math.floor(points);
    if (points <= 0) return;
    const need = S.mh - S.hu;
    const take = Math.min(need, points);
    const cost = take * 18;
    if (!spend(cost)){ note("Not enough credits to repair.", "warn"); return; }
    S.hu += take;
    note(`Repaired +${take} hull.`, "good");
  }

  function buyGood(g, qty){
    qty = Math.floor(qty);
    if (qty <= 0) return;
    const sys = systems()[S.l];
    const mk = market(sys, S);
    const pr = mk[g].price;
    const maxByCredits = Math.floor(S.cr / pr);
    const free = S.cp - totalCargo(S);
    const buy = Math.min(qty, maxByCredits, free, mk[g].avail);
    if (buy <= 0){ note("Cannot buy (credits/cargo/stock).", "warn"); return; }
    spend(buy * pr);
    S.cg[g] += buy;
    note(`Bought ${buy} ${GOODS[g].n}.`, "good");
  }

  function sellGood(g, qty){
    qty = Math.floor(qty);
    if (qty <= 0) return;
    const have = S.cg[g];
    const sell = Math.min(qty, have);
    if (sell <= 0){ note("No cargo to sell.", "warn"); return; }
    const sys = systems()[S.l];
    const mk = market(sys, S);
    const pr = mk[g].price;
    const payout = Math.round(sell * pr * 0.93); // station takes fee
    S.cg[g] -= sell;
    earn(payout);
    note(`Sold ${sell} ${GOODS[g].n} (+${payout} cr).`, "good");
    maybeCompleteJob();
  }

  function maybeCompleteJob(){
    if (!S.jb) return;
    if (S.l !== S.jb.t) return;
    if (S.d > S.jb.dl){
      note("Contract failed: deadline missed.", "bad");
      S.rp = clamp(S.rp - 6, -50, 200);
      S.jb = null;
      return;
    }
    const g = S.jb.g, q = S.jb.q;
    if (S.cg[g] < q){
      note("Contract pending: deliver cargo quantity.", "warn");
      return;
    }
    S.cg[g] -= q;
    earn(S.jb.rw);
    S.rp = clamp(S.rp + 5, -50, 200);
    note(`Contract complete! +${S.jb.rw} cr. Rep +5.`, "good");
    S.jb = null;
  }

  function acceptJob(){
    const sys = systems()[S.l];
    const off = makeOffer(S, sys);
    S.jb = off;
    note(`Contract accepted: ${off.q} ${GOODS[off.g].n} → ${systems()[off.t].name} by Day ${off.dl}.`, "good");
  }

  function abandonJob(){
    if (!S.jb) return;
    S.jb = null;
    S.rp = clamp(S.rp - 3, -50, 200);
    note("Contract abandoned. Rep -3.", "bad");
  }

  function buyUpgrade(key){
    const u = SHIP_UPGRADES.find(x=>x.key===key);
    if (!u){ note("Unknown upgrade.", "warn"); return; }
    if (!spend(u.cost)){ note("Insufficient credits.", "warn"); return; }

    if (key==="lz") S.la = clamp(S.la + 1, 1, 4);
    if (key==="sh") S.sh = clamp(S.sh + 1, 0, 4);
    if (key==="cp") S.cp = clamp(S.cp + 6, 6, 80);
    if (key==="fm") S.mf = clamp(S.mf + 6, 6, 60);

    // keep fuel/hull within new max
    S.fu = clamp(S.fu, 0, S.mf);

    note(`Installed: ${u.name}.`, "good");
  }

  // Combat mechanics
  function enemyProfile(en){
    const base = ENEMY_TYPES[en.t];
    const atk = base.atk + Math.floor(S.d*0.03);
    return { ...base, atk };
  }

  function dmgRollLaser(){
    // Laser tier increases both base and spread
    const base = 7 + S.la*2;
    const spread = 7 + S.la*2;
    return base + Math.floor(rand01(S) * spread);
  }
  function dmgRollEnemy(atk){
    const base = 3 + Math.floor(atk*0.55);
    const spread = 4 + Math.floor(atk*0.65);
    return base + Math.floor(rand01(S) * spread);
  }

  function applyEnemyShot(mult=1.0, evaded=false){
    if (!S.en) return;
    const ep = enemyProfile(S.en);
    if (evaded){
      note("Evasion burn successful — shot misses.", "good");
      return;
    }
    const raw = dmgRollEnemy(ep.atk);
    const shieldAbsorb = Math.floor(S.sh * 2.2);
    const taken = Math.max(0, Math.floor((raw - shieldAbsorb) * mult));
    S.hu = Math.max(0, S.hu - taken);
    if (taken > 0) note(`Hit! -${taken} hull.`, "bad");
    else note("Shields soak the hit.", "good");
    if (S.hu <= 0){
      S.md = MODE.GAMEOVER;
      note("Catastrophic breach. Your ship is lost.", "bad");
    }
  }

  function combatFire(){
    if (S.md !== MODE.COMBAT || !S.en) return;
    const dmg = dmgRollLaser();
    S.en.h = Math.max(0, S.en.h - dmg);
    note(`You fire: ${dmg} damage.`, "good");
    if (S.en.h <= 0){
      const rw = S.en.rw;
      earn(rw);
      S.rp = clamp(S.rp + 1, -50, 200);
      note(`Enemy disabled. Salvage +${rw} cr.`, "good");
      S.en = null;
      S.md = MODE.DOCK;
      maybeCompleteJob();
      return;
    }
    applyEnemyShot(1.0, false);
  }

  function combatBrace(){
    if (S.md !== MODE.COMBAT || !S.en) return;
    note("Bracing. Power routed to shields.", "warn");
    applyEnemyShot(0.55, false);
  }

  function combatEvade(){
    if (S.md !== MODE.COMBAT || !S.en) return;
    // Evade costs a little fuel; higher shield tiers help
    if (S.fu <= 0){
      note("No fuel for evasive burn!", "warn");
      applyEnemyShot(1.0, false);
      return;
    }
    S.fu = Math.max(0, S.fu - 1);
    const ep = enemyProfile(S.en);
    const base = 0.38 + 0.06*S.sh - 0.02*ep.atk;
    const chance = clamp(base, 0.12, 0.70);
    const ok = rand01(S) < chance;
    if (ok){
      // small counter-shot chance
      if (rand01(S) < 0.22){
        const dmg = Math.max(4, Math.floor(dmgRollLaser()*0.55));
        S.en.h = Math.max(0, S.en.h - dmg);
        note(`Evasive counterfire: ${dmg} damage.`, "good");
        if (S.en.h <= 0){
          const rw = S.en.rw;
          earn(rw);
          S.rp = clamp(S.rp + 1, -50, 200);
          note(`Enemy disabled. Salvage +${rw} cr.`, "good");
          S.en = null;
          S.md = MODE.DOCK;
          maybeCompleteJob();
          return;
        }
      } else {
        note("Clean dodge. No counter window.", "good");
      }
      applyEnemyShot(1.0, true);
    } else {
      note("Evasion fail — you drift into their firing lane.", "bad");
      applyEnemyShot(1.05, false);
    }
  }

  function combatRun(){
    if (S.md !== MODE.COMBAT || !S.en) return;
    if (S.fu < 2){
      note("Not enough fuel to run!", "warn");
      applyEnemyShot(1.0, false);
      return;
    }
    S.fu -= 2;
    const ep = enemyProfile(S.en);
    const base = 0.42 + 0.07*S.sh - 0.03*ep.atk + clamp(S.rp*0.002, -0.05, 0.05);
    const chance = clamp(base, 0.10, 0.78);
    if (rand01(S) < chance){
      S.en = null;
      S.md = MODE.DOCK;
      note("You break lock and slip into station traffic.", "good");
      maybeCompleteJob();
    } else {
      note("Run attempt fails — lock holds.", "bad");
      applyEnemyShot(1.10, false);
    }
  }

  // ---------- UI render ----------
  function fmt(n){ return (Math.floor(n)).toString(); }
  function pct01(x){ return Math.round(x*100) + "%"; }

  function hudPills(){
    const sys = systems()[S.l];
    const risk = sys.risk;
    const cargo = totalCargo(S);
    const hullPct = Math.round((S.hu / S.mh) * 100);
    const fuelPct = Math.round((S.fu / S.mf) * 100);

    const hullClass = hullPct < 28 ? "bad" : hullPct < 55 ? "warn" : "ac";
    const fuelClass = fuelPct < 18 ? "warn" : "ac";

    const repTag =
      S.rp >= 30 ? `<span class="v ac">${S.rp}</span>` :
      S.rp <= -10 ? `<span class="v bad">${S.rp}</span>` :
      `<span class="v warn">${S.rp}</span>`;

    hudEl.innerHTML = `
      <div class="pill"><span class="k">Day</span><span class="v">${fmt(S.d)}</span></div>
      <div class="pill"><span class="k">Port</span><span class="v">${sys.name}</span></div>
      <div class="pill"><span class="k">Credits</span><span class="v ac">${fmt(S.cr)}</span></div>
      <div class="pill"><span class="k">Fuel</span><span class="v ${fuelClass}">${fmt(S.fu)}/${fmt(S.mf)}</span></div>
      <div class="pill"><span class="k">Hull</span><span class="v ${hullClass}">${fmt(S.hu)}/${fmt(S.mh)}</span></div>
      <div class="pill"><span class="k">Cargo</span><span class="v">${fmt(cargo)}/${fmt(S.cp)}</span></div>
      <div class="pill"><span class="k">Rep</span>${repTag}</div>
      <div class="pill"><span class="k">Risk</span><span class="v">${pct01(risk)}</span></div>
    `;
  }

  function setTabs(){
    const leftTabs = [
      { id:MODE.MAP,  label:"Map" },
      { id:MODE.DOCK, label:"Dock" },
      { id:MODE.TRADE,label:"Trade" },
      { id:MODE.HELP, label:"Help" }
    ];
    tabsLeftEl.innerHTML = leftTabs.map(t => `
      <div class="tab ${S.md===t.id ? "on":""}" data-tab="${t.id}">${t.label}</div>
    `).join("");

    const rightTabs = [
      { id:MODE.DOCK,  label:"Dock" },
      { id:MODE.TRADE, label:"Trade" },
      { id:MODE.COMBAT,label:"Combat" },
      { id:MODE.HELP,  label:"Help" }
    ];
    tabsRightEl.innerHTML = rightTabs.map(t => `
      <div class="tab ${S.md===t.id ? "on":""}" data-tab="${t.id}">${t.label}</div>
    `).join("");

    tabsLeftEl.querySelectorAll(".tab").forEach(el=>{
      el.onclick = () => {
        const id = +el.dataset.tab;
        if (id === MODE.COMBAT && !S.en) return;
        if (id === MODE.TRADE && S.md === MODE.COMBAT) return;
        if (id === MODE.MAP) S.md = MODE.MAP;
        else S.md = id;
        note(S.nt || ""); // keep note, add subtle tap
        render();
      };
    });
    tabsRightEl.querySelectorAll(".tab").forEach(el=>{
      el.onclick = () => {
        const id = +el.dataset.tab;
        if (id === MODE.COMBAT && !S.en) { note("No active engagement."); render(); return; }
        if (S.md === MODE.COMBAT && (id === MODE.TRADE)) return;
        S.md = id;
        render();
      };
    });

    btnAudio.textContent = `Audio: ${S.au ? "On" : "Off"}`;
  }

  function leftActions(){
    const sys = systems();
    const here = sys[S.l];

    const btn = (text, fn, cls="", dis=false, title="") => {
      const b = document.createElement("button");
      b.textContent = text;
      if (cls) b.className = cls;
      if (title) b.title = title;
      b.disabled = !!dis;
      b.onclick = fn;
      return b;
    };

    leftActionsEl.innerHTML = "";

    if (S.md === MODE.COMBAT && S.en){
      leftActionsEl.append(
        btn("Fire [F]", ()=>{ combatFire(); afterAction(); }, "primary"),
        btn("Evade [E]", ()=>{ combatEvade(); afterAction(); }),
        btn("Brace [B]", ()=>{ combatBrace(); afterAction(); }),
        btn("Run [R]", ()=>{ combatRun(); afterAction(); }, "", false, "Costs 2 fuel; may fail")
      );
      leftHintEl.innerHTML = `Engagement protocol active. Your shields reduce incoming damage; evasion costs fuel.`;
      return;
    }

    // Quick actions common outside combat
    leftActionsEl.append(
      btn("Dock [1]", ()=>{ S.md = MODE.DOCK; render(); }),
      btn("Trade [2]", ()=>{ S.md = MODE.TRADE; render(); }),
      btn("Map [3]", ()=>{ S.md = MODE.MAP; render(); }),
      btn("Help [4]", ()=>{ S.md = MODE.HELP; render(); })
    );

    leftHintEl.innerHTML = `
      Current port: <span class="mono">${here.name}</span> (<span class="mono">${here.trait.n}</span>).
      Risk influences encounter rates during travel.
    `;
  }

  function rightPane(){
    const sys = systems();
    const here = sys[S.l];

    // Tags in map header
    mapLocTag.textContent = `${here.name} • ${here.trait.n}`;
    mapRiskTag.textContent = `Risk ${Math.round(here.risk*100)}%`;

    if (S.md === MODE.GAMEOVER){
      rightTitleEl.textContent = "After-Action Report";
      rightBodyEl.innerHTML = `
        <div class="notice">
          <div class="h">Ship Lost</div>
          <div>Your hull integrity has reached zero. This run is over — but the URL still encodes the final state.</div>
          <div class="hr"></div>
          <div class="btnrow">
            <button class="primary" id="btnRestart">Start New Run</button>
            <button class="ghost" id="btnKeepViewing">Keep Viewing Map</button>
          </div>
        </div>
        <div class="hr"></div>
        <div class="small mono">Final stats: Day ${fmt(S.d)} • Credits ${fmt(S.cr)} • Rep ${fmt(S.rp)}</div>
      `;
      $("#btnRestart").onclick = () => { S = newGame(); setURLFromState(false); render(); };
      $("#btnKeepViewing").onclick = () => { S.md = MODE.MAP; render(); };
      return;
    }

    if (S.md === MODE.HELP){
      rightTitleEl.textContent = "Help / How to Play";
      rightBodyEl.innerHTML = `
        <div class="notice">
          <div class="h">What is this?</div>
          <div>
            STARSPAN is an original retro space-trader & skirmish game. It’s a <span class="mono">single-file web app</span> where
            <b>all gameplay state lives in the URL hash</b>. Copy the URL to “move your save.”
          </div>
        </div>

        <div class="hr"></div>

        <div class="grid2">
          <div class="notice">
            <div class="h">Loop</div>
            <div>
              <b>Dock</b> → refuel/repair, take a contract, buy upgrades.<br/>
              <b>Trade</b> → buy low / sell high across ports.<br/>
              <b>Map</b> → jump to another system (fuel + days).<br/>
              Travel may trigger <b>combat</b> depending on risk.
            </div>
          </div>
          <div class="notice">
            <div class="h">Contracts</div>
            <div>
              Accept a delivery contract at a port, then deliver the specified goods before the deadline.
              Completing contracts improves reputation, which can slightly affect how often trouble finds you.
            </div>
          </div>
        </div>

        <div class="hr"></div>

        <div class="small">
          <div class="mono" style="color:var(--accent)">Keyboard</div>
          <div>
            <span class="kbd">1</span> Dock,
            <span class="kbd">2</span> Trade,
            <span class="kbd">3</span> Map,
            <span class="kbd">4</span> Help,
            <span class="kbd">F</span> Fire,
            <span class="kbd">E</span> Evade,
            <span class="kbd">B</span> Brace,
            <span class="kbd">R</span> Run
          </div>
          <div class="hr"></div>
          <div class="mono" style="color:var(--accent)">URL state</div>
          <div>
            Every action updates the URL hash. For frequent actions we use <span class="mono">replaceState</span> to avoid spamming history.
            Use <b>Checkpoint</b> to push a history entry you can back/forward through.
          </div>
        </div>
      `;
      return;
    }

    if (S.md === MODE.COMBAT){
      if (!S.en){
        S.md = MODE.DOCK;
        rightPane();
        return;
      }
      const ep = enemyProfile(S.en);
      rightTitleEl.textContent = "Combat Engagement";
      const hullPct = Math.round((S.hu/S.mh)*100);
      const enemyPct = Math.round((S.en.h/S.en.mh)*100);
      const hClass = hullPct < 28 ? "bad" : hullPct < 55 ? "warn" : "ac";
      const eClass = enemyPct < 28 ? "bad" : enemyPct < 55 ? "warn" : "ac";
      rightBodyEl.innerHTML = `
        <div class="notice">
          <div class="h">Contact</div>
          <div class="mono">${ep.n}</div>
          <div class="small">Attack rating: <span class="mono">${fmt(ep.atk)}</span> • Salvage estimate: <span class="mono">${fmt(S.en.rw)} cr</span></div>
        </div>

        <div class="hr"></div>

        <div class="grid2">
          <div class="notice">
            <div class="h">Your Ship</div>
            <div>Hull: <span class="mono v ${hClass}">${fmt(S.hu)}/${fmt(S.mh)}</span></div>
            <div>Fuel: <span class="mono">${fmt(S.fu)}/${fmt(S.mf)}</span></div>
            <div>Laser: <span class="mono">${fmt(S.la)}</span> • Shield: <span class="mono">${fmt(S.sh)}</span></div>
          </div>
          <div class="notice">
            <div class="h">Enemy</div>
            <div>Integrity: <span class="mono v ${eClass}">${fmt(S.en.h)}/${fmt(S.en.mh)}</span></div>
            <div class="small">Brace reduces damage. Evade costs 1 fuel; Run costs 2 fuel and may fail.</div>
          </div>
        </div>

        <div class="hr"></div>

        <div class="small mono">${escapeHtml(S.nt || "")}</div>
      `;
      return;
    }

    if (S.md === MODE.TRADE){
      rightTitleEl.textContent = "Exchange";
      const mk = market(here, S);
      const cargo = totalCargo(S);
      const free = S.cp - cargo;

      const rows = GOODS.map((g, i) => {
        const owned = S.cg[i];
        const price = mk[i].price;
        const avail = mk[i].avail;
        const canBuy = (S.cr >= price) && (free > 0) && (avail > 0);
        const canSell = owned > 0;
        return `
          <tr>
            <td>${g.n}</td>
            <td class="right">${fmt(price)}</td>
            <td class="right">${fmt(avail)}</td>
            <td class="right">${fmt(owned)}</td>
            <td class="right">
              <button ${canBuy ? "" : "disabled"} data-buy="${i}">Buy</button>
              <button ${canSell ? "" : "disabled"} data-sell="${i}">Sell</button>
            </td>
          </tr>
        `;
      }).join("");

      const jobLine = S.jb ? `
        <div class="notice">
          <div class="h">Active Contract</div>
          <div class="mono">
            Deliver ${fmt(S.jb.q)} ${GOODS[S.jb.g].n} to ${systems()[S.jb.t].name}
            by Day ${fmt(S.jb.dl)} for ${fmt(S.jb.rw)} cr.
          </div>
          <div class="small">Status: ${S.l===S.jb.t ? (S.cg[S.jb.g] >= S.jb.q ? "Ready to complete (sell/deliver)" : "At destination; acquire cargo") : "En route"}</div>
          <div class="hr"></div>
          <div class="btnrow">
            <button class="danger" id="btnAbandon">Abandon Contract</button>
          </div>
        </div>
      ` : "";

      rightBodyEl.innerHTML = `
        <div class="notice">
          <div class="h">${here.name}</div>
          <div class="small">Port trait: <span class="mono">${here.trait.n}</span> • Fees: <span class="mono">7%</span></div>
          <div class="small">Cargo space: <span class="mono">${fmt(cargo)}/${fmt(S.cp)}</span> (free <span class="mono">${fmt(free)}</span>)</div>
        </div>

        <div class="hr"></div>

        ${jobLine}

        <table class="table">
          <thead>
            <tr>
              <th>Good</th>
              <th class="right">Price</th>
              <th class="right">Stock</th>
              <th class="right">Owned</th>
              <th class="right">Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>

        <div class="hr"></div>
        <div class="small mono">${escapeHtml(S.nt || "")}</div>
      `;

      rightBodyEl.querySelectorAll("button[data-buy]").forEach(b=>{
        b.onclick = () => {
          buyGood(+b.dataset.buy, 1);
          afterAction();
        };
      });
      rightBodyEl.querySelectorAll("button[data-sell]").forEach(b=>{
        b.onclick = () => {
          sellGood(+b.dataset.sell, 1);
          afterAction();
        };
      });
      const btnAbandon = $("#btnAbandon");
      if (btnAbandon) btnAbandon.onclick = () => { abandonJob(); afterAction(); };
      return;
    }

    // Default: Dock pane
    rightTitleEl.textContent = "Dock Services";
    const mk = market(here, S);
    const offer = makeOffer(S, here);
    const targetName = systems()[offer.t].name;
    const deadlineIn = Math.max(0, offer.dl - S.d);
    const repTag =
      S.rp >= 30 ? `<span class="tag good">Rep ${fmt(S.rp)} (Respected)</span>` :
      S.rp <= -10 ? `<span class="tag bad">Rep ${fmt(S.rp)} (Wanted)</span>` :
      `<span class="tag warn">Rep ${fmt(S.rp)} (Unknown)</span>`;

    const jobBlock = S.jb ? `
      <div class="notice">
        <div class="h">Contract Board</div>
        <div class="mono">You already have an active contract.</div>
        <div class="small">Deliver ${fmt(S.jb.q)} ${GOODS[S.jb.g].n} → ${systems()[S.jb.t].name} by Day ${fmt(S.jb.dl)} for ${fmt(S.jb.rw)} cr.</div>
      </div>
    ` : `
      <div class="notice">
        <div class="h">Contract Offer</div>
        <div class="mono">
          Deliver ${fmt(offer.q)} ${GOODS[offer.g].n} to ${targetName} by Day ${fmt(offer.dl)}.
        </div>
        <div class="small">Reward: <span class="mono">${fmt(offer.rw)} cr</span> • Time remaining: <span class="mono">${fmt(deadlineIn)} days</span></div>
        <div class="hr"></div>
        <div class="btnrow">
          <button class="primary" id="btnAcceptJob">Accept Contract</button>
        </div>
      </div>
    `;

    const upRows = SHIP_UPGRADES.map(u => {
      const dis =
        (u.key==="lz" && S.la>=4) ||
        (u.key==="sh" && S.sh>=4) ||
        (u.key==="cp" && S.cp>=80) ||
        (u.key==="fm" && S.mf>=60) ||
        (S.cr < u.cost);
      const status =
        (u.key==="lz") ? `Laser Tier: ${fmt(S.la)}/4` :
        (u.key==="sh") ? `Shield Tier: ${fmt(S.sh)}/4` :
        (u.key==="cp") ? `Cargo Cap: ${fmt(S.cp)}/80` :
        (u.key==="fm") ? `Max Fuel: ${fmt(S.mf)}/60` : "";
      return `
        <tr>
          <td>
            <div class="mono" style="color:var(--text)">${u.name}</div>
            <div class="small">${u.desc}</div>
          </td>
          <td class="right mono">${status}</td>
          <td class="right mono">${fmt(u.cost)}</td>
          <td class="right">
            <button ${dis ? "disabled":""} data-up="${u.key}">Buy</button>
          </td>
        </tr>
      `;
    }).join("");

    rightBodyEl.innerHTML = `
      <div class="grid2">
        <div class="notice">
          <div class="h">${here.name}</div>
          <div class="small">Trait: <span class="mono">${here.trait.n}</span> • Risk: <span class="mono">${Math.round(here.risk*100)}%</span></div>
          <div style="margin-top:8px">${repTag}</div>
        </div>
        <div class="notice">
          <div class="h">Services</div>
          <div class="btnrow">
            <button id="btnRefuel1">Refuel +1 (12)</button>
            <button id="btnRefuelAll" class="primary">Refuel Max</button>
            <button id="btnRepair1">Repair +1 (18)</button>
            <button id="btnRepairAll" class="primary">Repair Max</button>
          </div>
          <div class="hr"></div>
          <div class="small">Fuel improves escape/evasion options; hull at 0 ends the run.</div>
        </div>
      </div>

      <div class="hr"></div>

      ${jobBlock}

      <div class="hr"></div>

      <div class="notice">
        <div class="h">Shipyard Upgrades</div>
        <table class="table">
          <thead>
            <tr>
              <th>Upgrade</th>
              <th class="right">Status</th>
              <th class="right">Cost</th>
              <th class="right"></th>
            </tr>
          </thead>
          <tbody>${upRows}</tbody>
        </table>
      </div>

      <div class="hr"></div>
      <div class="small mono">${escapeHtml(S.nt || "")}</div>
    `;

    // bind dock buttons
    $("#btnRefuel1").onclick = () => { refuel(1); afterAction(); };
    $("#btnRefuelAll").onclick = () => { refuel(999); afterAction(); };
    $("#btnRepair1").onclick = () => { repair(1); afterAction(); };
    $("#btnRepairAll").onclick = () => { repair(999); afterAction(); };

    const btnAccept = $("#btnAcceptJob");
    if (btnAccept) btnAccept.onclick = () => { acceptJob(); afterAction(); };

    rightBodyEl.querySelectorAll("button[data-up]").forEach(b=>{
      b.onclick = () => { buyUpgrade(b.dataset.up); afterAction(); };
    });
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => (
      c==="&" ? "&amp;" :
      c==="<" ? "&lt;" :
      c===">" ? "&gt;" :
      c==='"' ? "&quot;" : "&#39;"
    ));
  }

  function afterAction(){
    // keep state strictly in URL
    setURLFromState(false);
    render();
  }

  // ---------- Map drawing ----------
  const mapCanvas = $("#map");
  const mapCtx = mapCanvas.getContext("2d");

  function resizeCanvasToCSS(canvas){
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const w = Math.floor(rect.width * dpr);
    const h = Math.floor(rect.height * dpr);
    if (canvas.width !== w || canvas.height !== h){
      canvas.width = w;
      canvas.height = h;
    }
    return { w, h, dpr };
  }

  function drawMap(){
    const { w, h } = resizeCanvasToCSS(mapCanvas);
    mapCtx.clearRect(0,0,w,h);

    // subtle grid
    mapCtx.globalAlpha = 0.35;
    mapCtx.strokeStyle = "rgba(28,44,58,.75)";
    mapCtx.lineWidth = 1;
    for (let i=1;i<6;i++){
      const x = Math.floor(w*i/6), y = Math.floor(h*i/6);
      mapCtx.beginPath(); mapCtx.moveTo(x,0); mapCtx.lineTo(x,h); mapCtx.stroke();
      mapCtx.beginPath(); mapCtx.moveTo(0,y); mapCtx.lineTo(w,y); mapCtx.stroke();
    }
    mapCtx.globalAlpha = 1;

    const sys = systems();

    // precompute nearest neighbors for "lanes"
    const lanes = [];
    for (let i=0;i<sys.length;i++){
      const a = sys[i];
      const dists = sys.filter(s=>s.id!==a.id).map(b=>({ id:b.id, d:dist(a,b) })).sort((p,q)=>p.d-q.d);
      for (let k=0;k<3;k++){
        const j = dists[k].id;
        if (j>i) lanes.push([i,j]);
      }
    }

    // draw lanes
    mapCtx.globalAlpha = 0.35;
    mapCtx.strokeStyle = "rgba(102,242,255,.30)";
    mapCtx.lineWidth = 1.2;
    for (const [i,j] of lanes){
      const a = sys[i], b = sys[j];
      mapCtx.beginPath();
      mapCtx.moveTo(a.x*w, a.y*h);
      mapCtx.lineTo(b.x*w, b.y*h);
      mapCtx.stroke();
    }
    mapCtx.globalAlpha = 1;

    // draw systems
    for (const s of sys){
      const x = s.x*w, y = s.y*h;
      const r = 4 + Math.round(5*s.risk);
      // glow
      mapCtx.beginPath();
      mapCtx.fillStyle = `rgba(102,242,255,${0.18 + 0.25*(1-s.risk)})`;
      mapCtx.arc(x,y,r*2.6,0,Math.PI*2);
      mapCtx.fill();

      // core
      mapCtx.beginPath();
      mapCtx.fillStyle = (s.id===S.l) ? "rgba(156,255,106,.95)" : "rgba(214,246,255,.85)";
      mapCtx.arc(x,y,r,0,Math.PI*2);
      mapCtx.fill();

      // label
      mapCtx.font = `${Math.max(12, Math.floor(w/42))}px ui-monospace, Menlo, Consolas, monospace`;
      mapCtx.fillStyle = (s.id===S.l) ? "rgba(156,255,106,.95)" : "rgba(134,168,181,.92)";
      mapCtx.fillText(s.name, x + 10, y - 10);
    }

    // if in combat, draw alert ring around current
    if (S.md === MODE.COMBAT && S.en){
      const s = sys[S.l];
      const x = s.x*w, y = s.y*h;
      mapCtx.globalAlpha = 0.85;
      mapCtx.strokeStyle = "rgba(255,92,122,.9)";
      mapCtx.lineWidth = 2.5;
      mapCtx.beginPath();
      mapCtx.arc(x,y,18,0,Math.PI*2);
      mapCtx.stroke();
      mapCtx.globalAlpha = 1;
    }
  }

  function mapClicks(){
    mapCanvas.onclick = (ev) => {
      if (S.md === MODE.COMBAT && S.en){
        note("Cannot plot jumps during combat.", "warn");
        render();
        return;
      }
      const rect = mapCanvas.getBoundingClientRect();
      const x = (ev.clientX - rect.left) / rect.width;
      const y = (ev.clientY - rect.top) / rect.height;
      const sys = systems();
      let best = null;
      for (const s of sys){
        const dx = x - s.x, dy = y - s.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (!best || d < best.d) best = { id:s.id, d };
      }
      if (!best || best.d > 0.055){
        note("Click closer to a system node.");
        render();
        return;
      }
      const check = canTravelTo(best.id);
      if (!check.ok){
        note(`Need ${check.fuelCost} fuel for that jump.`, "warn");
        render();
        return;
      }
      travelTo(best.id);
      afterAction();
    };
  }

  // Right title should match mode
  function setRightTitle(){
    // handled inside rightPane, but keep consistent for Map mode
    if (S.md === MODE.MAP){
      rightTitleEl.textContent = "Navigation";
      const sys = systems();
      const here = sys[S.l];
      const targets = sys
        .filter(s=>s.id!==here.id)
        .map(s=>{
          const d = dist(here, s);
          const fuelCost = Math.max(1, Math.ceil(d/6));
          const days = 1 + Math.floor(d/10);
          return { s, d, fuelCost, days, ok: S.fu >= fuelCost };
        })
        .sort((a,b)=>a.d-b.d)
        .slice(0, 10);

      rightBodyEl.innerHTML = `
        <div class="notice">
          <div class="h">Plot Jump</div>
          <div class="small">
            Click a system on the map, or use the list below. Jumps consume fuel and advance the day counter.
            Higher risk increases encounter chances.
          </div>
        </div>

        <div class="hr"></div>

        <table class="table">
          <thead>
            <tr>
              <th>System</th>
              <th class="right">Fuel</th>
              <th class="right">Days</th>
              <th class="right">Risk</th>
              <th class="right"></th>
            </tr>
          </thead>
          <tbody>
            ${targets.map(t => `
              <tr>
                <td>
                  <div class="mono" style="color:var(--text)">${t.s.name}</div>
                  <div class="small">${t.s.trait.n}</div>
                </td>
                <td class="right mono">${fmt(t.fuelCost)}</td>
                <td class="right mono">${fmt(t.days)}</td>
                <td class="right mono">${Math.round(t.s.risk*100)}%</td>
                <td class="right">
                  <button ${t.ok ? "" : "disabled"} data-jump="${t.s.id}">Jump</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        <div class="hr"></div>
        <div class="small mono">${escapeHtml(S.nt || "")}</div>
      `;

      rightBodyEl.querySelectorAll("button[data-jump]").forEach(b=>{
        b.onclick = () => {
          travelTo(+b.dataset.jump);
          afterAction();
        };
      });
    }
  }

  function render(){
    // auto-correct: if in combat mode but no enemy, go dock
    if (S.md === MODE.COMBAT && !S.en) S.md = MODE.DOCK;

    hudPills();
    setTabs();
    leftActions();
    drawMap();

    if (S.md === MODE.MAP){
      setRightTitle();
    } else {
      rightPane();
    }

    // always keep URL in sync
    setURLFromState(false);
  }

  // ---------- Background starfield ----------
  const bg = $("#bg");
  const bgCtx = bg.getContext("2d");
  let starfield = null;

  function makeStarfield(seed){
    const stars = [];
    const n = 220;
    for (let i=0;i<n;i++){
      const k = mix32(seed ^ (i*0x9e3779b1) ^ 0xC001D00D);
      const x = (k % 10000) / 10000;
      const y = (mix32(k ^ 0xDEADBEEF) % 10000) / 10000;
      const z = (mix32(k ^ 0xA11CE) % 10000) / 10000; // depth
      stars.push({ x, y, z });
    }
    return { stars, t:0 };
  }

  function drawBg(dt){
    const rect = bg.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));
    const W = Math.floor(rect.width * dpr);
    const H = Math.floor(rect.height * dpr);
    if (bg.width !== W || bg.height !== H){ bg.width = W; bg.height = H; }

    if (!starfield) starfield = makeStarfield(S.sd);

    const ctx = bgCtx;
    ctx.clearRect(0,0,W,H);

    // slow drift; slightly changes with mode
    const speed = (S.md === MODE.COMBAT ? 0.065 : 0.028);
    starfield.t += dt * speed;

    for (const s of starfield.stars){
      const px = (s.x + starfield.t*(0.02 + 0.09*(1-s.z))) % 1.0;
      const py = (s.y + starfield.t*(0.01 + 0.07*(1-s.z))) % 1.0;
      const x = px * W;
      const y = py * H;

      const r = 0.6 + 2.0*(1-s.z);
      const a = 0.25 + 0.55*(1-s.z);

      // no fixed palette request: use subtle grayscale + alpha
      ctx.globalAlpha = a;
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    drawBg(dt);
    requestAnimationFrame(tick);
  }

  // ---------- Inputs ----------
  function onKey(e){
    const k = e.key.toLowerCase();
    if (k === "1"){ S.md = MODE.DOCK; render(); }
    if (k === "2"){ if (S.md!==MODE.COMBAT) { S.md = MODE.TRADE; render(); } }
    if (k === "3"){ if (S.md!==MODE.COMBAT) { S.md = MODE.MAP; render(); } }
    if (k === "4"){ S.md = MODE.HELP; render(); }

    if (S.md === MODE.COMBAT && S.en){
      if (k === "f"){ combatFire(); afterAction(); }
      if (k === "e"){ combatEvade(); afterAction(); }
      if (k === "b"){ combatBrace(); afterAction(); }
      if (k === "r"){ combatRun(); afterAction(); }
    }
  }

  // ---------- Footer buttons ----------
  btnCopyUrl.onclick = async () => {
    try{
      await navigator.clipboard.writeText(location.href);
      showToast("URL copied to clipboard.");
      beep("good");
    }catch(e){
      // fallback
      const t = document.createElement("textarea");
      t.value = location.href;
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      t.remove();
      showToast("URL copied.");
      beep("good");
    }
  };

  btnCheckpoint.onclick = () => {
    setURLFromState(true);
    showToast("Checkpoint saved (history entry).");
    beep("tap");
  };

  btnNewGame.onclick = () => {
    S = newGame();
    setURLFromState(false);
    render();
    showToast("New run started.");
  };

  btnAudio.onclick = () => {
    S.au = S.au ? 0 : 1;
    note(S.au ? "Audio enabled." : "Audio disabled.");
    afterAction();
  };

  // ---------- Navigation events ----------
  window.addEventListener("hashchange", () => {
    const st = loadStateFromURL();
    if (st){
      S = st;
      render();
      showToast("Loaded state from URL.");
    }
  });
  window.addEventListener("popstate", () => {
    const st = loadStateFromURL();
    if (st){
      S = st;
      render();
      showToast("Loaded state from history.");
    }
  });

  window.addEventListener("resize", () => { drawMap(); });
  window.addEventListener("keydown", onKey);

  // ---------- Boot ----------
  mapClicks();
  render();
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
